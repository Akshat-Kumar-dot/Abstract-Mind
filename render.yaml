# Render Blueprint: New > Blueprint, then pick this repository.
# Variables marked `sync: false` are asked for when the Blueprint is created
# (or set later under the service's Environment tab).
services:
  - type: web
    name: abstract-mind
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production          # Secure cookies, HSTS; requires APP_SECRET
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN         # e.g. https://abstract-mind.onrender.com (used for the Google redirect)
        sync: false
      - key: DATABASE_URL          # Postgres connection URL (Neon, Supabase or Render Postgres)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "20"
